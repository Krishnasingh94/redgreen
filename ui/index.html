<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='16' r='8' fill='%23D93A2B'/%3E%3Ccircle cx='22' cy='16' r='8' fill='%230E9F55'/%3E%3C/svg%3E">
<title>RedGreen</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="/" aria-label="RedGreen home">
    <span class="lamps" aria-hidden="true"><i class="l r"></i><i class="l g"></i></span>
    <span class="word">RedGreen</span>
  </a>
  <div class="status">
    <span id="modelBadge" class="badge"><i class="dot"></i><span>Checking model</span></span>
    <span id="sbxBadge" class="badge quiet"><span>Sandbox</span></span>
  </div>
</header>
<div class="shell">
  <nav class="side" aria-label="Reports and runs">
    <form class="ghform" id="ghSide">
      <label for="ghUrlSide">Reproduce a GitHub issue</label>
      <div class="ghrow"><input id="ghUrlSide" type="url" placeholder="https://github.com/owner/repo/issues/1" required><button type="submit">Load</button></div>
      <p class="gherr" role="alert"></p>
    </form>
    <a class="shop" href="/shop/" target="_blank" rel="noopener">Open the demo shop</a>
    <h2 class="sideh">Bug reports</h2>
    <ul id="reports" class="list"></ul>
    <h2 class="sideh">Past runs</h2>
    <ul id="runs" class="list"></ul>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
